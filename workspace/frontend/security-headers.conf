# Shared response headers (Todo 7). Included explicitly in every `location` block below:
# nginx does NOT inherit server-level `add_header` into a location that sets its own
# `add_header` (e.g. the Cache-Control overrides on /assets/, /mockServiceWorker.js, /), so
# a single server-level copy would silently drop these headers from most real responses.
#
# style-src 'unsafe-inline' covers React's inline `style={{...}}` attributes (VoicePanel,
# Wizard, SyncStatus, ...); cdn.jsdelivr.net is the pinned Pretendard stylesheet/font
# (App.css `@import`); worker-src 'self' allows the same-origin MSW service worker.
# HSTS is intentionally omitted - the external Nginx Proxy Manager TLS edge owns it.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; worker-src 'self'; base-uri 'self'; object-src 'none'" always;
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
