name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workspace/frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run lint checks
        run: npm run lint

      - name: Run type checks
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

      - name: Run mock-off contract transport tests
        run: npm run test:transport

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Python and uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.11"
          working-directory: workspace/backend
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Run lint checks
        run: uv run --locked ruff check .

      - name: Run type checks
        run: uv run --locked basedpyright

      - name: Run tests
        run: >-
          uv run --locked pytest
          --cov=mapkeeper
          --cov-report=term-missing
          --cov-fail-under=100

  container:
    name: Container build gate
    needs:
      - frontend
      - backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate Compose configuration
        run: docker compose -f workspace/compose.yaml config --quiet

      - name: Build service images
        run: docker compose -f workspace/compose.yaml build
