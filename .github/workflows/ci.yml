name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workspace/frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run lint checks
        run: npm run lint

      - name: Run type checks
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mapkeeper
          POSTGRES_PASSWORD: local
          POSTGRES_DB: mapkeeper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mapkeeper -d mapkeeper_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://mapkeeper:local@127.0.0.1:5432/mapkeeper_test
      TEST_DATABASE_URL: postgresql+asyncpg://mapkeeper:local@127.0.0.1:5432/mapkeeper_test
      MVP_ACTOR_ID: 99999999-9999-4999-8999-999999999999
    defaults:
      run:
        working-directory: workspace/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Python and uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.11"
          working-directory: workspace/backend
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Prepare test database
        run: uv run --locked alembic upgrade head

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Run lint checks
        run: uv run --locked ruff check .

      - name: Run type checks
        run: uv run --locked basedpyright

      - name: Run tests
        run: >-
          uv run --locked pytest
          --cov=mapkeeper
          --cov-report=term-missing
          --cov-fail-under=90

  frontend-backend-contract:
    name: Frontend and backend contract gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mapkeeper
          POSTGRES_PASSWORD: local
          POSTGRES_DB: mapkeeper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mapkeeper -d mapkeeper_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://mapkeeper:local@127.0.0.1:5432/mapkeeper_test
      MVP_ACTOR_ID: 99999999-9999-4999-8999-999999999999
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Python and uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.11"
          working-directory: workspace/backend
          enable-cache: true
          cache-dependency-glob: workspace/backend/uv.lock

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workspace/frontend/package-lock.json

      - name: Install locked dependencies
        run: |
          uv --project workspace/backend sync --locked --all-groups
          npm ci --prefix workspace/frontend

      - name: Prepare canonical demo database
        run: |
          uv --project workspace/backend run --locked alembic -c workspace/backend/alembic.ini upgrade head
          uv --project workspace/backend run --locked python -m mapkeeper.db.seed

      - name: Run actual FastAPI contract regression
        env:
          VITE_API_MOCKING: "false"
          VITE_API_BASE_URL: http://127.0.0.1:18000
        run: |
          uv --project workspace/backend run --locked uvicorn mapkeeper.main:app \
            --app-dir workspace/backend/src --host 127.0.0.1 --port 18000 \
            > "$RUNNER_TEMP/mapkeeper-backend.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/health > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$RUNNER_TEMP/mapkeeper-backend.log"
              exit 1
            fi
            sleep 1
          done
          npm --prefix workspace/frontend run test:backend-contract

  container:
    name: Container build gate
    needs:
      - frontend
      - backend
      - frontend-backend-contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate Compose configuration
        run: docker compose -f workspace/compose.yaml config --quiet

      - name: Build service images
        run: docker compose -f workspace/compose.yaml build
