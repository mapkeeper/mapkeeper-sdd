name: Deploy development

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: development-deployment
  cancel-in-progress: false

env:
  BACKEND_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mapkeeper-backend
  FRONTEND_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mapkeeper-frontend

jobs:
  publish-and-deploy:
    name: Publish and deploy application
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        run: |
          : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
          : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY is required}"
          : "${DEPLOY_USER:?DEPLOY_USER is required}"
          : "${TS_AUDIENCE:?TS_AUDIENCE is required}"
          : "${TS_OAUTH_CLIENT_ID:?TS_OAUTH_CLIENT_ID is required}"

      - name: Log in to GHCR
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: workspace/backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE_NAME }}:development

      - name: Build and publish frontend image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: workspace/frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=
            VITE_API_MOCKING=false
            VITE_MOCK_SCENARIO=default
            VITE_SHOW_DEVELOPER_TOOLS=false
          tags: |
            ${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE_NAME }}:development

      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ secrets.DEPLOY_HOST }}

      - name: Configure SSH
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload Compose configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p "$HOME/mapkeeper"'
          scp workspace/compose.yaml "$DEPLOY_USER@$DEPLOY_HOST:mapkeeper/compose.yaml.next"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -eu
          cd "$HOME/mapkeeper"
          if ! docker compose -f compose.yaml.next config --quiet; then
            rm -f compose.yaml.next
            exit 1
          fi
          REMOTE

      - name: Deploy and verify health
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_IMAGE_REF: ${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          FRONTEND_IMAGE_REF: ${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io --username '${{ github.actor }}' --password-stdin"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- \
            "$BACKEND_IMAGE_REF" "$FRONTEND_IMAGE_REF" <<'REMOTE'
          set -u
          backend_image_ref=$1
          frontend_image_ref=$2
          cd "$HOME/mapkeeper"

          previous_backend_image=
          previous_frontend_image=
          if [ -f compose.yaml ]; then
            backend_container_id=$(docker compose ps -q backend || true)
            frontend_container_id=$(docker compose ps -q frontend || true)
            if [ -n "$backend_container_id" ]; then
              previous_backend_image=$(docker inspect \
                --format '{{.Config.Image}}' "$backend_container_id")
            fi
            if [ -n "$frontend_container_id" ]; then
              previous_frontend_image=$(docker inspect \
                --format '{{.Config.Image}}' "$frontend_container_id")
            fi
            cp compose.yaml compose.pre-deploy.yaml
          fi
          mv compose.yaml.next compose.yaml

          verify_health() {
            curl --fail --retry 10 --retry-delay 2 --retry-connrefused \
              http://127.0.0.1:8000/health || return 1
            frontend_endpoint=$(docker compose port frontend 8080) || return 1
            curl --fail --retry 10 --retry-delay 2 --retry-connrefused \
              "http://$frontend_endpoint/healthz" || return 1
          }

          # Migrations run from the image being deployed, so the schema always
          # matches the code that expects it. A migration must stay compatible
          # with the previous release: a failed deployment rolls the containers
          # back, but the schema stays where the migration left it.
          apply_migrations() {
            BACKEND_IMAGE="$backend_image_ref" FRONTEND_IMAGE="$frontend_image_ref" \
              docker compose run --rm --no-deps backend \
                alembic upgrade head || return 1
          }

          deploy_new_version() {
            BACKEND_IMAGE="$backend_image_ref" FRONTEND_IMAGE="$frontend_image_ref" \
              docker compose pull backend frontend || return 1
            apply_migrations || return 1
            BACKEND_IMAGE="$backend_image_ref" FRONTEND_IMAGE="$frontend_image_ref" \
              docker compose up -d --no-build --remove-orphans \
                --wait --wait-timeout 90 || return 1
            verify_health
          }

          rollback() {
            if [ -z "$previous_backend_image" ] || \
              [ -z "$previous_frontend_image" ] || \
              [ ! -f compose.pre-deploy.yaml ]; then
              echo "No previous successful deployment is available." >&2
              return 1
            fi

            cp compose.pre-deploy.yaml compose.yaml || return 1
            BACKEND_IMAGE="$previous_backend_image" \
              FRONTEND_IMAGE="$previous_frontend_image" \
              docker compose up -d --no-build --remove-orphans \
                --wait --wait-timeout 90 || return 1
            verify_health
          }

          if deploy_new_version; then
            cp compose.yaml compose.last-successful.yaml
            {
              printf 'BACKEND_IMAGE=%s\n' "$backend_image_ref"
              printf 'FRONTEND_IMAGE=%s\n' "$frontend_image_ref"
            } > last-successful-images.env.tmp
            mv last-successful-images.env.tmp last-successful-images.env
            rm -f compose.pre-deploy.yaml
            echo "Deployment succeeded."
          else
            deploy_status=$?
            echo "Deployment failed; attempting rollback." >&2
            if rollback; then
              rm -f compose.pre-deploy.yaml
              echo "Rollback succeeded." >&2
            else
              echo "Rollback failed." >&2
            fi
            exit "$deploy_status"
          fi
          REMOTE
